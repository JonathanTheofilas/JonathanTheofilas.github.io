<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Jonathan Theofilas</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6f8; --text: #4a4a4a; --muted: #8a949e;
      --blue: #3fa9f5; --glow: #7ed0ff;
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      min-height: 100dvh; display: grid; place-content: center; text-align: center;
      gap: 1rem; padding: 2rem;
      background: radial-gradient(120% 100% at 50% 30%, #ffffff 40%, #e2e9ef 100%);
      color: var(--text); font-family: "Nunito", system-ui, sans-serif;
    }
    .channel {
      background: linear-gradient(180deg, #ffffff, #eef4f9);
      border: 1px solid #fff; border-radius: 28px;
      box-shadow: 0 10px 30px rgba(63,110,160,.14), 0 0 0 6px rgba(158,220,255,.45);
      padding: clamp(2rem, 6vw, 3.5rem) clamp(2rem, 8vw, 5rem);
    }
    h1 { font-size: clamp(3.5rem, 14vw, 6.5rem); font-weight: 800; line-height: 1; }
    h1 span { color: var(--blue); }
    p { color: var(--muted); font-weight: 700; margin-top: .6rem; }
    a {
      display: inline-block; margin-top: 1.6rem; padding: .8rem 1.8rem;
      background: linear-gradient(180deg, #5cb8f8, #2f8fe0); color: #fff;
      text-decoration: none; font-weight: 800; border-radius: 999px;
      box-shadow: 0 6px 18px rgba(63,110,160,.25);
      transition: transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s;
    }
    a:hover { transform: scale(1.06); box-shadow: 0 6px 18px rgba(63,110,160,.25), 0 0 18px var(--glow); }
    .note { font-size: .75rem; margin-top: 1.4rem; }
  </style>
</head>
<body>
  <main class="channel">
    <h1>4<span>0</span>4</h1>
    <p>This channel hasn't been installed.</p>
    <a href="/">Back to the plaza</a>
    <p class="note">Not affiliated with Nintendo.</p>
  </main>
</body>
</html>
